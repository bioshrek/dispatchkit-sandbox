[project]
name = "wordfreq"
version = "0.1.0"
description = "A small word-frequency CLI; the payload for dispatchkit's live trial."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wordfreq = "wordfreq.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordfreq"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
